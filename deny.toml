# cargo-deny: what `make audit` and the Security workflow check the dependency
# tree against. https://embarkstudios.github.io/cargo-deny/

[graph]
# Every platform the app is released for, so a Windows-only or macOS-only
# dependency is checked too.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "arm-unknown-linux-gnueabihf",
]
all-features = true

[advisories]
# Unmaintained crates only count when the workspace depends on them directly:
# the ones deeper down (gtk-rs 0.18 under Tauri's Linux backend, unic-*) are
# for those crates to replace, and nothing here can.
unmaintained = "workspace"
# Every entry needs its reason, and is looked at again when a fix exists.
ignore = [
    # Marvin: RSA decryption in `rsa` leaks timing. It reaches us through rPGP,
    # and no release of `rsa` fixes it yet. Decryption here runs locally, once
    # per message opened, with no one on the other end timing it — the attack
    # needs a decryption oracle queried many times over.
    { id = "RUSTSEC-2023-0071", reason = "no fixed rsa release; local-only decryption is no timing oracle" },
]

[licenses]
# kuverta is AGPL-3.0-or-later; everything here is compatible with it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "AGPL-3.0-or-later",
    # jpeg-encoder, in scannerd: FSF-approved free licence.
    "IJG",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace have no version, and are not the
# wildcards this is meant to catch.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
