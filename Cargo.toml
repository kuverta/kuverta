[workspace]
resolver = "2"
members = [
    "crates/core-store",
    "crates/core-proto",
    "crates/core-accounts",
    "crates/core-rules",
    "crates/core-paper",
    "crates/core-smtp",
    "crates/core-rpc",
    "apps/cli",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
core-store = { path = "crates/core-store" }
core-proto = { path = "crates/core-proto" }
core-accounts = { path = "crates/core-accounts" }
core-rules = { path = "crates/core-rules" }
core-paper = { path = "crates/core-paper" }
core-smtp = { path = "crates/core-smtp" }
core-rpc = { path = "crates/core-rpc" }

anyhow = "1.0.104"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.5"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "env"] }

rusqlite = { version = "0.40.2", features = ["bundled"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11.9"
mail-builder = "0.5.0"
# rustls throughout; ring rather than aws-lc to match the rest of the tree and
# keep the C toolchain out of the build.
mail-send = { version = "0.6.2", default-features = false, features = ["ring", "tls12", "builder"] }
sha2 = "0.11.0"
# PKCE, for the OAuth2 loopback flow: a code verifier and a `state` value are
# security parameters and must be unguessable, so they come from the OS rather
# than from the clock.
getrandom = "0.4.3"
base64 = "0.23.1"
async-trait = "0.1.92"
# rustls rather than the platform's native TLS, matching the IMAP transport.
# 0.13 renamed the TLS features and split `form` out of the default set; the
# device flow posts form bodies, so it has to be requested explicitly.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "http2", "charset"] }
# Pinned to 3.x: 4.x rewrote the API around `keyring-core` and requires
# registering a credential store at startup. 3.6 is maintained and its `Entry`
# API is stable; revisit when there is a reason to.
keyring = { version = "3.6.3", features = ["apple-native", "sync-secret-service", "windows-native"] }
tokio-rustls = "0.26.5"
# `ring` explicitly: reqwest's rustls feature pulls aws-lc-rs, mail-send pulls
# ring, and with both present rustls refuses to pick a process-wide default
# provider. Every TLS config in this workspace names its provider instead of
# relying on that default, so the feature is requested here rather than
# inherited by accident.
rustls = { version = "0.23.44", features = ["ring"] }
rustls-platform-verifier = "0.7.0"

[profile.dev]
# Sync work is I/O and parse bound; unoptimised mail-parser is painfully slow on
# real mailboxes, so build dependencies with optimisation even in dev.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
