[package]
name = "core-pgp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
core-accounts.workspace = true

pgp.workspace = true
# rPGP's signing and encryption take rand 0.8's `CryptoRng`; a newer rand
# would be a second, incompatible trait.
rand = "0.8.5"
mail-parser.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Real built messages to protect, rather than hand-written ones that would
# only test what the test author thought mail-builder writes.
core-smtp.workspace = true
