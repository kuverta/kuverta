[package]
name = "core-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# The preview worker as a program of its own, which the tests start. The app
# is its own worker (`--preview-worker`) and never ships this.
name = "kuverta-preview-worker"
path = "src/bin/preview_worker.rs"
test = false
doc = false

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
serde_json.workspace = true

[dependencies]
core-store.workspace = true
core-proto.workspace = true
core-rules.workspace = true
core-ai.workspace = true
core-paper.workspace = true
core-accounts.workspace = true
core-smtp.workspace = true
core-pgp.workspace = true

serde.workspace = true
mail-parser.workspace = true
# The setup assistant: waiting on servers it has started, reading Apple Mail's
# account database, and a provider's published settings.
tokio = { workspace = true, features = ["time"] }
getrandom.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
plist = "1.10.1"
# Reading the passwords Thunderbird saved, in the scheme NSS wrote them with:
# PBKDF2-SHA256, AES-256-CBC for the key, 3DES-CBC for each login.
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
des = "0.9.0"
hmac = "0.13.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha1 = "0.11.0"
sha2.workspace = true
base64.workspace = true
serde_json.workspace = true
roxmltree = "0.21.1"
# Reading files a person attaches, so the assistant can write about them: the
# text in a PDF, and the XML inside Word, LibreOffice and Excel files. Deflate
# only — every office format uses it, and nothing else pulls in a C library.
pdf-extract = "0.12.1"
# Writing PDFs the assistant composes, and putting the person's signature on
# a page of one: the same crate pdf-extract already reads them with, without
# its default date and threading dependencies.
lopdf = { version = "0.42.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Safe preview: attachments drawn by decoders written in Rust, in a worker
# process locked down before it reads a byte of them — never by the system's
# image and PDF frameworks. hayro forbids unsafe code; 0.5 is the last that
# builds on this toolchain. The image codecs are the ones mail carries, and no
# rayon: the worker is one thread, which its limits assume.
hayro = "0.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
thiserror.workspace = true
# Today's date for the urgency agent, and checking the deadlines it is given.
chrono.workspace = true
tracing.workspace = true

# Locking the preview worker down: resource limits, and on macOS the sandbox.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
