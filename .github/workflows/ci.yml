name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; a compromised step gets a read-only
# token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Debug info is most of what `target` weighs, here and in the cache, and
  # nothing in CI reads a backtrace. Leaving it out is the cheapest half of
  # the disk fix below.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      # What the workspace links against on Linux: D-Bus for the keychain
      # (Secret Service), and WebKitGTK with its friends for the desktop app.
      # Without them every step that compiles fails, starting with Clippy.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      # The runner has about 14 GB free and this job wants more: a restored
      # `target` for the whole workspace, every test binary clippy and
      # `cargo test` build, and four containers. On 2026-10-30 it ran out
      # during `cargo test` and the runner died writing its own log — which
      # fails the job with no step marked red, and without the `if: failure()`
      # dump at the end ever running. Nothing deleted here is used by this
      # workspace — the hosted tool cache is deliberately left alone, because
      # the node that `make test-js` runs under may live in it.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift
          df -h /

      # `target` is cached whole, which is fast and grows: each new
      # Cargo.lock writes a fresh copy and nothing prunes what the last one
      # left. If the disk gets tight again, replacing this with a cache that
      # prunes is the fix, rather than deleting more of the runner above.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Brought up before the build so seeding overlaps with compilation.
      - name: Start the dev IMAP server
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Wait for the fixtures to load
        run: |
          for _ in $(seq 1 60); do
            if docker compose -f docker/docker-compose.yml logs mailseed \
                 | grep -q "mailseed: done"; then
              exit 0
            fi
            sleep 2
          done
          echo "mailseed did not finish in time"
          docker compose -f docker/docker-compose.yml logs
          exit 1

      # Paperless sets up its database on first start, which takes longer
      # than a cached build: the tests that sign in to it failed when they
      # got there first.
      - name: Wait for Paperless
        run: |
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/documents/ || true)
            if [ "$code" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Paperless did not start in time"
          docker compose -f docker/docker-compose.yml logs paperless
          exit 1

      # Printed because the failure it guards against explains itself nowhere
      # else: when the disk fills, the step that dies is not marked red and
      # `if: failure()` never runs, so the last number anyone sees is this one.
      - name: Disk space
        run: df -h /

      # Required, not optional: without this a broken compose file would let the
      # integration tests silently skip and the build would still look green.
      - name: Test
        run: cargo test --workspace
        env:
          KUVERTA_REQUIRE_DEV_SERVER: "1"

      # The window's and the triage surface's tests run under node, not
      # cargo, and were not run here until 2026-10-20: two of them had been
      # failing on main for a week without a red tick to say so.
      - name: Test the window and the triage surface
        run: make test-js

      - name: Dump server logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

  # The app is released for Windows too, and nothing else here builds there.
  # Compiling is the check: the dev servers are Linux containers.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install

      # The TLS library's assembly needs NASM to build for Windows.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build and test the app's crates
        run: cargo test -p core-accounts -p core-rpc --lib && cargo build -p kuverta-desktop -p kuverta-cli
