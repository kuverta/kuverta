name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository; a compromised step gets a read-only
# token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      # What the workspace links against on Linux: D-Bus for the keychain
      # (Secret Service), and WebKitGTK with its friends for the desktop app.
      # Without them every step that compiles fails, starting with Clippy.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Brought up before the build so seeding overlaps with compilation.
      - name: Start the dev IMAP server
        run: docker compose -f docker/docker-compose.yml up -d

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Wait for the fixtures to load
        run: |
          for _ in $(seq 1 60); do
            if docker compose -f docker/docker-compose.yml logs mailseed \
                 | grep -q "mailseed: done"; then
              exit 0
            fi
            sleep 2
          done
          echo "mailseed did not finish in time"
          docker compose -f docker/docker-compose.yml logs
          exit 1

      # Paperless sets up its database on first start, which takes longer
      # than a cached build: the tests that sign in to it failed when they
      # got there first.
      - name: Wait for Paperless
        run: |
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/documents/ || true)
            if [ "$code" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Paperless did not start in time"
          docker compose -f docker/docker-compose.yml logs paperless
          exit 1

      # Required, not optional: without this a broken compose file would let the
      # integration tests silently skip and the build would still look green.
      - name: Test
        run: cargo test --workspace
        env:
          KUVERTA_REQUIRE_DEV_SERVER: "1"

      - name: Dump server logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

  # The app is released for Windows too, and nothing else here builds there.
  # Compiling is the check: the dev servers are Linux containers.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install

      # The TLS library's assembly needs NASM to build for Windows.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Build and test the app's crates
        run: cargo test -p core-accounts -p core-rpc --lib && cargo build -p kuverta-desktop -p kuverta-cli
