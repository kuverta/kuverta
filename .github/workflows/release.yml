name: Release

# A tag like v0.2.0 builds kuverta for macOS, Linux and Windows and puts the
# installers on one draft release, to be read over and published by hand.
# `tools/release.sh` makes the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job makes the release, so the three builds do not each make their
  # own draft when they finish at the same time.
  release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      # The tag and the version the app reports have to agree, or the update
      # check would offer this release to itself forever.
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi

      # The draft for this tag, made if there is none yet, so building a tag
      # again fills the same draft.
      - name: Draft release
        id: draft
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const existing = releases.find((release) => release.tag_name === tag);
            if (existing) return existing.id;
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `kuverta ${tag}`, draft: true,
              body: [
                '**macOS** — download the `.dmg`, open it and drag kuverta into Applications. If macOS says it cannot check the app, allow it once under System Settings → Privacy & Security → Open Anyway.',
                '',
                '**Linux** — the `.AppImage` runs on most distributions (`chmod +x` it first); the `.deb` and `.rpm` install through the package manager.',
                '',
                '**Windows** — run the `-setup.exe`. Windows builds are not tested yet; SmartScreen warns about unsigned programs (More info → Run anyway).',
              ].join('\n'),
            });
            return data.id;

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # One app for both kinds of Mac.
          - os: macos-14
            targets: aarch64-apple-darwin x86_64-apple-darwin
            args: --target universal-apple-darwin
          # The oldest supported Ubuntu, so the AppImage runs on older systems
          # too: it links against the glibc it was built with.
          - os: ubuntu-22.04
            targets: ""
            args: ""
          - os: windows-latest
            targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain and targets
        run: |
          rustup toolchain install
          if [ -n "${{ matrix.targets }}" ]; then
            rustup target add ${{ matrix.targets }}
          fi

      # What the app links against on Linux: WebKitGTK for the window, D-Bus
      # for the keychain.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libssl-dev file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      # The TLS library's assembly needs NASM to build for Windows.
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ matrix.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tauri CLI
        run: npm install --global @tauri-apps/cli@2

      # The triage surface is copied in, not committed, so the window's
      # "triage" link has something to open.
      - name: Copy the triage surface into the app
        run: kuverta-bird/tools/install-into.sh apps/desktop/ui

      # Signing and notarisation happen only when the secrets are there.
      # Without them the Mac app is signed ad hoc, which Apple Silicon requires
      # to run it at all, and macOS asks once before opening it (see
      # docs/releasing.md). A secret that is not set arrives as an empty
      # string, and Tauri takes an empty APPLE_CERTIFICATE for a certificate
      # and fails to import it — so only the ones that are set are passed on.
      - name: Apple signing, if configured
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              {
                echo "$name<<KUVERTA_EOF"
                echo "$value"
                echo "KUVERTA_EOF"
              } >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.release.outputs.id }}
