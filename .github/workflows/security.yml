name: Security

# Dependencies with known advisories or unexpected licences and sources,
# static analysis of the code and of these workflows, and fuzzing of the code
# that reads other people's bytes.
#
# Pushes and pull requests get a short fuzz run per target; the nightly run
# fuzzes for longer and picks up advisories published since the last push.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Advisories (RustSec), licences, banned crates and crates from anywhere
  # but crates.io, as deny.toml sets them out.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # jsdom and Playwright are dev dependencies only, but they run in CI and on
  # every developer's machine.
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Audit kuverta-bird
        working-directory: kuverta-bird
        run: npm audit --audit-level=high

  # The workflows themselves: unpinned actions, permissions wider than a job
  # needs, expressions interpolated into shell, and artifacts restored into a
  # job that signs things. CI is where the signing keys are, so it is worth
  # auditing like anything else that runs.
  #
  # Pinned actions are the reason this job exists rather than a one-off tidy:
  # `uses: some/action@v4` follows whatever that tag points at today, and a
  # tag is a label its owner can move. Every action here is pinned to a commit
  # instead, and this is what stops the next one being added on a tag.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: zizmor
        run: pip install "zizmor==1.16.3"

      # `--offline` so the audit does not depend on GitHub answering, and
      # cannot be turned off by a rate limit.
      - name: Audit the workflows
        run: zizmor --offline --persona=regular --format sarif .github/workflows/ > zizmor.sarif

      - name: Report
        if: always()
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust is analysed from source without building it; the UI is plain
        # JavaScript; `actions` looks for injection in these workflows.
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false
      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          category: /language:${{ matrix.language }}

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [parse_message, backfill_headers, open_pgp, reply_source, text, read_html, scan_picture]
    env:
      # A minute each on a push or pull request, ten at night.
      FUZZ_TIME: ${{ github.event_name == 'schedule' && '600' || '60' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      # core-accounts links D-Bus for the keychain on Linux.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev

      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-fuzz

      # The fuzz crate has no lock file of its own: starting from the app's
      # means the parsers fuzzed are the versions that ship.
      - name: Use the workspace's dependency versions
        run: cp Cargo.lock fuzz/Cargo.lock

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: fuzz-${{ matrix.target }}-

      # The corpus grows run by run: restored from the latest run on any
      # branch, saved under a new key each time since caches are immutable.
      - name: Restore corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # The prebuilt cargo-fuzz is a musl binary, and cargo-fuzz builds for
      # its own triple unless told otherwise: musl has no standard library
      # installed here and no address sanitizer at all.
      - name: Fuzz
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} \
            docker/dovecot/seed/inbox docker/dovecot/seed/archive \
            -- -max_total_time=$FUZZ_TIME -max_len=262144 -rss_limit_mb=4096

      # Merged down so the cache holds a minimal corpus, not every input
      # that happened to be interesting once.
      - name: Minimise corpus
        if: success() && github.ref == 'refs/heads/main'
        run: cargo +nightly fuzz cmin --target x86_64-unknown-linux-gnu ${{ matrix.target }} fuzz/corpus/${{ matrix.target }}

      - name: Save corpus
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # What went wrong, in the artifact's name.
      #
      # Downloading an artifact, or reading a job's log, needs admin on the
      # repository; listing the artifacts does not. So the name carries what
      # can be learnt without the file — libFuzzer's own prefix, which says
      # whether the target panicked (`crash-`), ran out of memory (`oom-`) or
      # hung (`timeout-`), and how big the input was. Those are different
      # problems with different fixes, and a run that fails with neither the
      # log nor the file readable is otherwise just a red tick.
      - name: Name the failure
        if: failure()
        id: crash
        run: |
          found=$(ls fuzz/artifacts/${{ matrix.target }} 2>/dev/null | head -1)
          if [ -z "$found" ]; then
            echo "what=no-artifact" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file="fuzz/artifacts/${{ matrix.target }}/$found"
          size=$(wc -c < "$file" | tr -d ' ')
          echo "what=${found%%-*}-${size}bytes" >> "$GITHUB_OUTPUT"
          # And the input itself, in hex, across as many names as it takes.
          #
          # Reading a job's log or downloading an artifact both need admin on
          # the repository; listing the artifacts needs nothing. So a small
          # input is carried in the names, where anyone who can see the repo
          # can read it — including whoever has to fix it and cannot fetch the
          # file. Only for inputs small enough to be worth it; a big one is in
          # the artifact and nowhere else.
          if [ "$size" -le 400 ]; then
            hex=$(xxd -p "$file" | tr -d '\n')
            echo "hex1=${hex:0:170}" >> "$GITHUB_OUTPUT"
            echo "hex2=${hex:170:170}" >> "$GITHUB_OUTPUT"
            echo "hex3=${hex:340:170}" >> "$GITHUB_OUTPUT"
          fi

      # The input itself, to reproduce with
      # `cargo +nightly fuzz run <target> <file>`.
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.target }}-${{ steps.crash.outputs.what }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      # The same input in hex, one name a part. Nothing is in these but the
      # name; see "Name the failure" for why that is the useful bit.
      - name: The input, part one
        if: failure() && steps.crash.outputs.hex1 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hex1-${{ steps.crash.outputs.hex1 }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: The input, part two
        if: failure() && steps.crash.outputs.hex2 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hex2-${{ steps.crash.outputs.hex2 }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

      - name: The input, part three
        if: failure() && steps.crash.outputs.hex3 != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hex3-${{ steps.crash.outputs.hex3 }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
