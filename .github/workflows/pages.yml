name: Website

# Builds website/ with MkDocs and publishes it to GitHub Pages at
# https://kuverta.github.io/kuverta/. Needs Settings → Pages → Source set to
# "GitHub Actions" once.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default. `deploy` asks for what it needs and no job else has
# it: a token that can publish a website, or mint an OIDC identity for one,
# is not something the job that runs MkDocs over untrusted Markdown should be
# holding.
permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but a
# deployment already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs
        run: pip install -r website/requirements.txt

      # --strict turns every warning — a broken link, a missing page, an
      # unknown anchor — into a failed build rather than a quietly broken site.
      - name: Build
        run: mkdocs build --strict -f website/mkdocs.yml -d "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
