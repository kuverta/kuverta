name: Website

# Builds website/ with MkDocs and publishes it to GitHub Pages at
# https://kuverta.github.io/kuverta/. Needs Settings → Pages → Source set to
# "GitHub Actions" once.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default. `deploy` asks for what it needs and no job else has
# it: a token that can publish a website, or mint an OIDC identity for one,
# is not something the job that runs MkDocs over untrusted Markdown should be
# holding.
permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but a
# deployment already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs
        run: pip install -r website/requirements.txt

      # --strict turns every warning — a broken link, a missing page, an
      # unknown anchor — into a failed build rather than a quietly broken site.
      - name: Build
        run: mkdocs build --strict -f website/mkdocs.yml -d "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
