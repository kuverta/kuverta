name: Website

# Builds website/ with MkDocs and publishes it to GitHub Pages at
# https://kuverta.github.io/kuverta/, with the apt repository made from the
# latest releases at /apt. Needs Settings → Pages → Source set to
# "GitHub Actions" once; see website/docs/developers/releasing.md for the apt
# repository's signing key.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"
      - "tools/apt-repo.sh"
  # A published release goes into the apt repository. Every deployment
  # replaces the whole site, so the repository is made again on every run,
  # not only on this one.
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default. `deploy` asks for what it needs and no job else has
# it: a token that can publish a website, or mint an OIDC identity for one,
# is not something the job that runs MkDocs over untrusted Markdown should be
# holding.
permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, but a
# deployment already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The apt repository, in a job of its own: it is the only one that holds
  # the signing key, and the job that runs MkDocs never sees it. Without the
  # key it builds nothing, and the site is published without /apt.
  apt:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.repo.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      # The .deb of the last five published releases, so apt can go back a
      # version. Drafts and pre-releases are left out.
      - name: Download the packages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/debs"
          gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases \
              --limit 5 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              gh release download "$tag" --repo "$REPO" --pattern '*.deb' --dir "$RUNNER_TEMP/debs"
            done
          ls -l "$RUNNER_TEMP/debs"

      - name: Build the repository
        id: repo
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::APT_SIGNING_KEY is not set; the site is published without the apt repository"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob
          debs=("$RUNNER_TEMP"/debs/*.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "::warning::no published release has a .deb; the site is published without the apt repository"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # apt-ftparchive is in the runner image today; this is for the day
          # it is not.
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          tools/apt-repo.sh "$RUNNER_TEMP/apt" "${debs[@]}"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - if: steps.repo.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apt
          path: ${{ runner.temp }}/apt
          retention-days: 1

  build:
    needs: apt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow token is not left in .git/config for
          # every later step, and every action they run, to read.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs
        run: pip install -r website/requirements.txt

      # --strict turns every warning — a broken link, a missing page, an
      # unknown anchor — into a failed build rather than a quietly broken site.
      - name: Build
        run: mkdocs build --strict -f website/mkdocs.yml -d "$RUNNER_TEMP/site"

      - name: Add the apt repository
        if: needs.apt.outputs.built == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apt
          path: ${{ runner.temp }}/site/apt

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
