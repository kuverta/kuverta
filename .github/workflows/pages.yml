name: Website

# Builds website/ with MkDocs and publishes it to GitHub Pages at
# https://kuverta.github.io/kuverta/. Needs Settings → Pages → Source set to
# "GitHub Actions" once.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, but a
# deployment already running is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install MkDocs
        run: pip install -r website/requirements.txt

      # --strict turns every warning — a broken link, a missing page, an
      # unknown anchor — into a failed build rather than a quietly broken site.
      - name: Build
        run: mkdocs build --strict -f website/mkdocs.yml -d "$RUNNER_TEMP/site"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
