# A Dovecot pretending to be Gmail, for the folder layout only.
#
# LOCAL DEVELOPMENT ONLY: cleartext auth on an unencrypted port, and a static
# passdb that accepts any username with one shared password.
#
# Gmail is the provider most likely to break this client, and the reasons are
# structural rather than behavioural: mail lives under a `[Gmail]/` hierarchy,
# archiving means the folder marked `\All` rather than one marked `\Archive`,
# and the same message appears in several folders at once because labels are
# exposed as folders. All three can be reproduced without a Google account, and
# that is what this server is for.
#
# What it deliberately does NOT reproduce: Gmail has no CONDSTORE, so real
# syncs cannot skip unchanged folders; its All Mail holds a copy of everything,
# so a first sync sees the whole mailbox twice; and expunging from All Mail
# deletes permanently. Those need the real thing.

protocols = imap

auth_allow_cleartext = yes
auth_mechanisms = plain login

log_debug = category=imap

namespace inbox {
  separator = /

  # The image declares the usual Drafts/Junk/Sent/Trash with special-use
  # attributes. Left alone they would sit alongside the [Gmail] ones and the
  # mailbox would have two folders marked \Sent — which Gmail does not, and
  # which would make any test of folder resolution meaningless.
  mailbox Drafts {
    auto = no
    special_use =
  }
  mailbox Junk {
    auto = no
    special_use =
  }
  mailbox Sent {
    auto = no
    special_use =
  }
  mailbox Trash {
    auto = no
    special_use =
  }

  mailbox "[Gmail]/All Mail" {
    auto = subscribe
    special_use = \All
  }
  mailbox "[Gmail]/Sent Mail" {
    auto = subscribe
    special_use = \Sent
  }
  mailbox "[Gmail]/Drafts" {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox "[Gmail]/Spam" {
    auto = subscribe
    special_use = \Junk
  }
  mailbox "[Gmail]/Trash" {
    auto = subscribe
    special_use = \Trash
  }
}
