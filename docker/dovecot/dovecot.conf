# Dovecot 2.3 — LOCAL DEVELOPMENT ONLY.
#
# No TLS, plaintext auth, and a static passdb that accepts any username with one
# shared password. This exists so `cargo test` and manual sync runs have a real
# IMAP server to talk to. It must never be exposed beyond localhost.

protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stderr

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_home = /srv/mail/%u
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000
first_valid_uid = 1000

passdb {
  driver = static
  args = password=devpass allow_all_users=yes
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}

namespace inbox {
  inbox = yes
  prefix =

  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

protocol imap {
  mail_max_userip_connections = 20
}
