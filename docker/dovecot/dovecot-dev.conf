# Included after the image's own config (dovecot.conf ends with
# `!include_try conf.d/*.conf`), so these settings win.
#
# LOCAL DEVELOPMENT ONLY: cleartext auth on an unencrypted port, and a static
# passdb that accepts any username with one shared password.

protocols = imap

# Without this Dovecot refuses PLAIN/LOGIN on a non-TLS connection.
auth_allow_cleartext = yes
auth_mechanisms = plain login

# The image's conf.d/auth.conf already declares `passdb static` reading
# USER_PASSWORD from the environment; docker-compose.yml supplies it.

log_debug = category=imap

# Dovecot's default "english" mailbox set does not mark Archive with a
# SPECIAL-USE attribute, but Gmail and Microsoft 365 both do. Declare it so the
# dev server exercises the same code path as the real ones.
namespace inbox {
  mailbox Archive {
    auto = subscribe
    special_use = \Archive
  }
}
