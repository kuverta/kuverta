name: kuverta-dev

# Local development stack. Nothing here is hardened; see docker/README.md.
#
#   docker compose up -d                 # IMAP + fixtures + SMTP sink + Paperless
#   docker compose --profile ai up -d    # + Ollama
#
# Paperless-ngx is part of the default stack rather than behind a profile: post
# is not a separate feature to switch on, it is half of what this client is for,
# and a dev environment that only has mail in it quietly makes the paper half
# something you remember to test rather than something you use. It costs a Redis
# and a Django, and the first start is slow while it builds its index.

services:
  # Dovecot 2.4: the 2.3 images are amd64-only and crash under Rosetta on Apple
  # Silicon. 2.4 runs rootless, so IMAP listens on 31143 inside the container.
  dovecot:
    image: dovecot/dovecot:2.4.4
    environment:
      USER_PASSWORD: devpass
    ports:
      - "10143:31143"
    volumes:
      - maildata:/srv/vmail
      - ./dovecot/dovecot-dev.conf:/etc/dovecot/conf.d/90-kuverta-dev.conf:ro

  # Loads the .eml fixtures over IMAP once Dovecot answers. Runs once, exits.
  # The image is distroless with no shell tools, so readiness is handled by the
  # seeder retrying rather than by a compose healthcheck.
  mailseed:
    image: python:3.13-alpine
    depends_on:
      - dovecot
    environment:
      IMAP_HOST: dovecot
      IMAP_PORT: "31143"
      IMAP_USER: dev@kuverta.test
      IMAP_PASS: devpass
    volumes:
      - ./dovecot/seed:/seed:ro
      - ./dovecot/seed-imap.py:/seed-imap.py:ro
    command: ["python3", "/seed-imap.py"]

  # A second Dovecot wearing Gmail's folder layout. Not seeded — the tests that
  # use it create what they need, because what is being tested is the shape of
  # the mailbox rather than its contents. See dovecot-gmail.conf.
  dovecot-gmail:
    image: dovecot/dovecot:2.4.4
    environment:
      USER_PASSWORD: devpass
    ports:
      - "10144:31143"
    volumes:
      - gmaildata:/srv/vmail
      - ./dovecot/dovecot-gmail.conf:/etc/dovecot/conf.d/90-kuverta-gmail.conf:ro

  # SMTP sink for the send path: accepts submissions and exposes a REST API so
  # tests can assert on exactly what went over the wire.
  #
  # There is no round trip back into Dovecot on purpose. Delivering for real
  # would mean running a full MTA alongside, and the thing under test is our
  # submission, not the internet's routing. The Sent-folder copy is a separate
  # concern and is tested against Dovecot directly.
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "1025:1025"   # SMTP submission
      - "8025:8025"   # REST API and web UI
    environment:
      # Mailpit offers no AUTH by default, and a client configured to
      # authenticate correctly refuses to silently skip it — so the sink has to
      # advertise AUTH over cleartext and accept whatever it is given.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # On Apple Silicon this container has no GPU access (no Metal passthrough), so
  # it is slow. Use it for CI and parity; run Ollama natively for real dev work.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  paperless-redis:
    image: redis:7-alpine
    volumes:
      - paperless-redis:/data

  paperless:
    # Pinned: `latest` moved to a release that refuses to start without
    # PAPERLESS_SECRET_KEY, and the dev stack broke without a change here.
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
    depends_on:
      - paperless-redis
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_URL: http://localhost:8000
      # Paperless refuses to start without one. This instance is bound to
      # localhost and holds only generated test post; never reuse the value.
      PAPERLESS_SECRET_KEY: kuverta-dev-only-not-a-secret-7f3c9a1e5b2d4086
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: admin
      # Sign-ins are limited to 5 a minute by default, and the tests sign in
      # once each — so running them twice in a row failed with "throttled".
      # This instance is for tests only; a real one keeps the default.
      PAPERLESS_TOKEN_THROTTLE_RATE: 600/min
      PAPERLESS_OCR_LANGUAGE: deu+eng
      PAPERLESS_OCR_LANGUAGES: deu eng
      # Set explicitly rather than left to the default, because `scannerd`
      # depends on it: a photograph of a letter on a desk is never square, and
      # straightening it is ocrmypdf's job here rather than the Pi's. The
      # capture daemon crops and uploads; upstream does the rest.
      PAPERLESS_OCR_DESKEW: "true"
      PAPERLESS_OCR_ROTATE_PAGES: "true"
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_FILENAME_FORMAT: "{created_year}/{correspondent}/{title}"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      # scannerd drops captured pages here; Paperless consumes them.
      - ./paperless/consume:/usr/src/paperless/consume

volumes:
  maildata:
  gmaildata:
  ollama:
  paperless-redis:
  paperless-data:
  paperless-media:
  paperless-export:
