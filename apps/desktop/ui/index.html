<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>fuckmail</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <strong>fuckmail</strong>
    <span id="status">starting…</span>
    <input id="search" type="search" placeholder="/ to search" spellcheck="false">
  </header>

  <nav id="filters"></nav>

  <!-- The scroll container. `spacer` gives it the full scrollable height while
       only a screenful of rows exists in the DOM; `content` is translated to
       meet the scroll offset. -->
  <div id="viewport">
    <div id="spacer"></div>
    <div id="content"></div>
  </div>

  <section id="reading" hidden>
    <h2 id="reading-subject"></h2>
    <p id="reading-meta"></p>
    <pre id="reading-body"></pre>
  </section>

  <section id="compose" hidden>
    <div class="compose-head">
      <strong id="compose-what">New message</strong>
      <span id="compose-envelope"></span>
    </div>
    <input id="compose-to" placeholder="to — comma separated" spellcheck="false">
    <input id="compose-cc" placeholder="cc" spellcheck="false">
    <input id="compose-bcc" placeholder="bcc (never appears in the message)" spellcheck="false">
    <input id="compose-subject" placeholder="subject">
    <textarea id="compose-body" rows="10" spellcheck="false"></textarea>
    <div class="compose-actions">
      <button id="compose-send">Send</button>
      <button id="compose-cancel">Cancel</button>
      <span class="hint">ctrl/cmd+enter sends · escape cancels</span>
    </div>
  </section>

  <footer>
    <span>j/k move</span>
    <span>enter read</span>
    <span>e archive</span>
    <span># trash</span>
    <span>u unread</span>
    <span>z undo</span>
    <span>c compose</span>
    <span>R reply</span>
    <span>r sync</span>
    <span>/ search</span>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
