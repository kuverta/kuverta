[package]
name = "scannerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "scannerd"
path = "src/lib.rs"

[[bin]]
name = "scannerd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# Its own reqwest rather than the workspace's, so the TLS provider is ring and
# not aws-lc. The workspace's `rustls` feature makes aws-lc the provider, and on
# a Pi Zero W (ARMv6) that is untried assembly; ring's handshake has been run on
# one. aws-lc is still compiled — the workspace rustls keeps its default
# features — but with `rustls-no-provider`, and ring installed as the process
# default when the uploader is made, it is never what runs.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
# Straightening a page photographed at an angle: the only thing that decodes a
# photograph. JPEG alone, and no rayon — the Zero W has one core. The encoder is
# jpeg-encoder's rather than image's: on the Zero W, image's took 5.2 seconds
# for a 5-megapixel page.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jpeg-encoder = "0.7.1"
# Judging a photograph: its greyscale alone, which image's decoder cannot be
# asked for. Both are already built for image.
zune-core = "0.5.3"
zune-jpeg = "0.5.15"
# The setup page. hyper is already built for reqwest; these add its server half.
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
# Two threads so the page answers while the loop waits on the camera, which on
# a single-core Pi Zero is most of the time.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net"] }
toml.workspace = true
# The one thing that needs a calendar: the clock on the display, which has to
# be the Pi's local time and not UTC.
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The e-paper display: drawing and fonts into a one-bit frame, which is pure
# arithmetic and tested on a laptop like the rest.
embedded-graphics = "0.8.2"
# The LCD's own drawing: paths with anti-aliasing, and Inter rasterised at any
# size, so the panel does not look like a cash register. Both pure Rust.
tiny-skia = "0.12.0"
fontdue = "0.9.4"
u8g2-fonts = { version = "0.8.0", features = ["embedded_graphics_textstyle"] }

# Getting that frame onto the panel: SPI and four GPIO lines. Linux only, so the
# rest still builds and tests on a Mac.
[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22.1"

[dev-dependencies]
chrono.workspace = true
