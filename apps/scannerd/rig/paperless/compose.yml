# Paperless-ngx on the rig, installed in /opt/kuverta-paperless by setup.sh.
# Start: docker compose up -d    Stop: docker compose down
#
# The version is pinned: document_importer only takes an export made by the
# same version, and moving it between machines is done with an export.
name: kuverta-paperless
services:
  broker:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
    restart: unless-stopped
    depends_on:
      - broker
    ports:
      - "8010:8000"
    env_file:
      - paperless.env
      # PAPERLESS_SECRET_KEY, made by setup.sh on the Pi; not in the repo.
      - paperless.secrets.env
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
volumes:
  data:
  media:
  redisdata:
